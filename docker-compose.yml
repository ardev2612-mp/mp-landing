version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp-landing-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - mixpost_network
      - landing_internal

  web:
    image: nginx:alpine
    container_name: mp-landing-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - mixpost_network
      - landing_internal

  db:
    image: mysql:8.0
    container_name: mp-landing-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-landing_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - landing_internal

networks:
  mixpost_network:
    external: true
  landing_internal:
    driver: bridge

volumes:
  db_data:
